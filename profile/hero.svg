.name{opacity:0;animation:rise 1.2s .2s ease-out forwards}
.role{opacity:0;animation:rise 1.2s .9s ease-out forwards}
.tag{opacity:0;animation:rise 1.2s 1.6s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.wave1{animation:sway 9s linear infinite}
.wave2{animation:sway 14s linear infinite reverse}
@keyframes sway{from{transform:translateX(0)}to{transform:translateX(-500px)}}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
